openapi: 3.0.3
info:
  title: PUC Crypto API (Azure Backend)
  version: 1.0.0
  description: |
    API informativa de cotações de criptomoedas em Reais (BRL), métricas globais de mercado e perfil de usuário para a plataforma **PUC Crypto**, hospedada no Microsoft Azure.
  contact:
    name: Equipe PUC Crypto
    email: contato@puc-crypto.com.br
servers:
  - url: https://crypto-frontend-bvdbdccnbwb3f7bv.eastus2-01.azurewebsites.net/api
    description: Produção (Azure Functions, Flex Consumption + Node 22)
  - url: http://localhost:7071/api
    description: Desenvolvimento local (Azure Functions Core Tools)

paths:
  /cryptos:
    get:
      summary: Listar cotações de criptomoedas em Reais (BRL)
      description: Retorna a lista de criptomoedas disponíveis com cotações atualizadas em BRL, variações em 24h, métricas de capitalização e visão geral de mercado.
      operationId: getCryptos
      tags:
        - Criptomoedas
      parameters:
        - name: search
          in: query
          description: Termo de busca por nome ou ticker (ex. Bitcoin, SOL)
          required: false
          schema:
            type: string
        - name: category
          in: query
          description: Filtro por categoria do ativo
          required: false
          schema:
            type: string
            enum: [all, layer1, defi, stablecoin, meme, nft]
            default: all
        - name: sortBy
          in: query
          description: Campo para ordenação
          required: false
          schema:
            type: string
            enum: [rank, name, priceBrl, change24h, marketCapBrl, volume24hBrl]
            default: rank
        - name: order
          in: query
          description: Direção da ordenação
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: limit
          in: query
          description: Quantidade máxima de registros retornados
          required: false
          schema:
            type: integer
            default: 50
        - name: page
          in: query
          description: Número da página para paginação
          required: false
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Lista de cotações obtida com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoListResponse'
        '500':
          description: Erro interno no processamento do servidor Azure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Cadastrar uma nova criptomoeda
      description: |
        Grava nome, símbolo e ícone na collection cryptos do MongoDB Atlas. O símbolo
        é normalizado para maiúsculas e possui índice único: repetir um símbolo já
        cadastrado devolve 409.
      operationId: createCrypto
      tags:
        - Criptomoedas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CryptoInput'
      responses:
        '201':
          description: Criptomoeda cadastrada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoItemResponse'
        '400':
          description: Dados inválidos. O campo details lista cada problema encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Já existe uma criptomoeda com o símbolo informado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Falha ao gravar no banco de dados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /cryptos/{id}:
    get:
      summary: Obter detalhes de uma criptomoeda
      description: Retorna os dados completos e histórico recente de cotação de um criptoativo específico pelo seu ID (ex. bitcoin, ethereum, solana).
      operationId: getCryptoById
      tags:
        - Criptomoedas
      parameters:
        - name: id
          in: path
          description: ObjectId de 24 caracteres gerado pelo MongoDB
          required: true
          schema:
            type: string
            pattern: '^[a-f0-9]{24}$'
            example: 652f1a9b3c4d5e6f7a8b9c0d
      responses:
        '200':
          description: Detalhes da criptomoeda retornados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoItemResponse'
        '400':
          description: Id fora do formato de ObjectId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Criptomoeda não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Editar uma criptomoeda
      description: |
        Atualização parcial: envie apenas os campos que mudaram. Manter o próprio
        símbolo é permitido; usar o símbolo de outra moeda devolve 409.
      operationId: updateCrypto
      tags:
        - Criptomoedas
      parameters:
        - name: id
          in: path
          description: ObjectId de 24 caracteres gerado pelo MongoDB
          required: true
          schema:
            type: string
            pattern: '^[a-f0-9]{24}$'
            example: 652f1a9b3c4d5e6f7a8b9c0d
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CryptoUpdateInput'
      responses:
        '200':
          description: Criptomoeda atualizada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoItemResponse'
        '400':
          description: Id inválido ou nenhum campo válido informado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Criptomoeda não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: O símbolo informado já pertence a outra criptomoeda.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Excluir uma criptomoeda
      operationId: deleteCrypto
      tags:
        - Criptomoedas
      parameters:
        - name: id
          in: path
          description: ObjectId de 24 caracteres gerado pelo MongoDB
          required: true
          schema:
            type: string
            pattern: '^[a-f0-9]{24}$'
            example: 652f1a9b3c4d5e6f7a8b9c0d
      responses:
        '200':
          description: Criptomoeda excluída com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 652f1a9b3c4d5e6f7a8b9c0d
                      deleted:
                        type: boolean
                        example: true
        '400':
          description: Id fora do formato de ObjectId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Criptomoeda não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me:
    get:
      summary: Obter dados do usuário autenticado
      description: Retorna as informações do usuário autenticado via Bearer Token, incluindo preferências e lista de criptomoedas favoritas.
      operationId: getMe
      tags:
        - Usuário & Autenticação
      security:
        - BearerAuth: []
        - AzureApimKey: []
      responses:
        '200':
          description: Dados do usuário retornados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Não autorizado - Token de autenticação ausente ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me/watchlist:
    get:
      summary: Listar criptomoedas favoritas do usuário
      description: Retorna todos os itens salvos na lista de observação/favoritos do usuário autenticado.
      operationId: getWatchlist
      tags:
        - Favoritos / Watchlist
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lista de favoritos retornada com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  total:
                    type: integer
                    example: 3
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserWatchlistItem'
    post:
      summary: Adicionar criptomoeda aos favoritos
      description: Adiciona um novo ativo na lista de favoritos do usuário.
      operationId: addWatchlistItem
      tags:
        - Favoritos / Watchlist
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWatchlistRequest'
      responses:
        '201':
          description: Criptomoeda favoritada com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/UserWatchlistItem'
        '400':
          description: Dados de requisição inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me/watchlist/{id}:
    delete:
      summary: Remover criptomoeda dos favoritos
      description: Remove um item da lista de favoritos pelo seu ID de registro.
      operationId: removeWatchlistItem
      tags:
        - Favoritos / Watchlist
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: Identificador do registro de favorito a ser removido
          required: true
          schema:
            type: string
            example: fav_1724792000
      responses:
        '200':
          description: Item removido dos favoritos com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Ativo removido dos favoritos com sucesso.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de autenticação JWT informado no header Authorization (Bearer <token>).
    AzureApimKey:
      type: apiKey
      in: header
      name: Ocp-Apim-Subscription-Key
      description: Chave de assinatura para clientes consumindo através do Azure API Management.

  schemas:
    CryptoAsset:
      type: object
      required:
        - rank
        - id
        - name
        - symbol
        - iconUrl
        - priceBrl
        - change24h
        - high24h
        - low24h
        - volume24hBrl
        - marketCapBrl
        - circulatingSupply
        - sparkline7d
      properties:
        rank:
          type: integer
          example: 1
        id:
          type: string
          example: bitcoin
        name:
          type: string
          example: Bitcoin
        symbol:
          type: string
          example: BTC
        iconUrl:
          type: string
          format: uri
          example: https://assets.coingecko.com/coins/images/1/large/bitcoin.png
        priceBrl:
          type: number
          format: double
          example: 348920.50
        change24h:
          type: number
          format: double
          example: 3.92
        high24h:
          type: number
          format: double
          example: 352100.00
        low24h:
          type: number
          format: double
          example: 341500.00
        volume24hBrl:
          type: number
          format: double
          example: 145890200.00
        marketCapBrl:
          type: number
          format: double
          example: 6890450120300.00
        circulatingSupply:
          type: string
          example: 19.7M BTC
        rating:
          type: integer
          example: 5
        lastModified:
          type: string
          example: 21 Out, 2026
        category:
          type: string
          enum: [layer1, defi, stablecoin, meme, nft]
          example: layer1
        sparkline7d:
          type: array
          items:
            type: number
          example: [330000, 334000, 332000, 339000, 342500, 345000, 348920.50]
        slug:
          type: string
          description: Identificador legível herdado do catálogo de mercado.
          example: bitcoin
        listed:
          type: boolean
          description: |
            Indica se o símbolo tem cotação no catálogo de mercado. Quando false,
            preço, variação e volume vêm zerados: a moeda foi cadastrada mas ainda
            não tem cotação associada.
          example: true
        iconSource:
          type: string
          enum: [preset, upload]
          description: Origem do ícone escolhida no cadastro.
          example: preset
        iconPresetId:
          type: string
          description: Id do ícone SVG embutido no front, quando iconSource = preset.
          example: bitcoin
        iconDataUrl:
          type: string
          description: PNG enviado pelo usuário em data URI base64, quando iconSource = upload.
          example: data:image/png;base64,iVBORw0KGgo=
        iconFileName:
          type: string
          example: bitcoin.png
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CryptoInput:
      type: object
      required:
        - name
        - symbol
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 60
          example: Bitcoin
        symbol:
          type: string
          pattern: '^[A-Za-z0-9]{2,10}$'
          description: Convertido para maiúsculas pela API. Índice único na collection.
          example: BTC
        iconSource:
          type: string
          enum: [preset, upload]
          example: preset
        iconPresetId:
          type: string
          pattern: '^[a-z0-9-]{1,64}$'
          description: Usado quando iconSource = preset.
          example: bitcoin
        iconDataUrl:
          type: string
          description: |
            Imagem em data URI base64. Apenas os tipos png, jpeg, webp e svg+xml são
            aceitos, e o valor não pode passar de 3 MB. Obrigatório quando
            iconSource = upload.
          example: data:image/png;base64,iVBORw0KGgo=
        iconFileName:
          type: string
          maxLength: 255
          example: bitcoin.png

    CryptoUpdateInput:
      description: |
        Mesmos campos do cadastro, todos opcionais. É preciso informar ao menos um.
      allOf:
        - $ref: '#/components/schemas/CryptoInput'
        - type: object
          required: []

    CryptoItemResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/CryptoAsset'

    MarketOverview:
      type: object
      properties:
        totalMarketCapBrl:
          type: number
          example: 14850000000000.00
        totalVolume24hBrl:
          type: number
          example: 485900000000.00
        btcDominancePercent:
          type: number
          example: 57.2
        ethDominancePercent:
          type: number
          example: 18.4
        solDominancePercent:
          type: number
          example: 8.5
        marketTrend:
          type: string
          enum: [bullish, bearish, neutral]
          example: bullish
        marketChange24h:
          type: number
          example: 2.7

    CryptoListResponse:
      type: object
      required:
        - success
        - timestamp
        - currency
        - total
        - data
      properties:
        success:
          type: boolean
          example: true
        timestamp:
          type: string
          format: date-time
          example: '2026-08-27T23:05:00Z'
        currency:
          type: string
          example: BRL
        total:
          type: integer
          example: 10
        data:
          type: array
          items:
            $ref: '#/components/schemas/CryptoAsset'
        marketOverview:
          $ref: '#/components/schemas/MarketOverview'

    UserWatchlistItem:
      type: object
      required:
        - id
        - cryptoId
        - symbol
        - name
        - addedAt
      properties:
        id:
          type: string
          example: fav_1
        cryptoId:
          type: string
          example: bitcoin
        symbol:
          type: string
          example: BTC
        name:
          type: string
          example: Bitcoin (BTC)
        iconUrl:
          type: string
          format: uri
          example: https://assets.coingecko.com/coins/images/1/large/bitcoin.png
        addedAt:
          type: string
          example: Adicionado recentemente

    CreateWatchlistRequest:
      type: object
      required:
        - cryptoId
        - symbol
        - name
      properties:
        cryptoId:
          type: string
          example: solana
        symbol:
          type: string
          example: SOL
        name:
          type: string
          example: Solana (SOL)
        iconUrl:
          type: string
          format: uri
          example: https://assets.coingecko.com/coins/images/4128/large/solana.png

    UserPreferences:
      type: object
      properties:
        currency:
          type: string
          enum: [BRL, USD]
          example: BRL
        theme:
          type: string
          enum: [light, dark]
          example: light
        language:
          type: string
          enum: [pt-BR, en]
          example: pt-BR
        notificationsEnabled:
          type: boolean
          example: true

    UserProfile:
      type: object
      required:
        - id
        - name
        - email
        - avatarUrl
        - role
        - organization
        - watchlist
        - preferences
      properties:
        id:
          type: string
          example: usr_puc_991823
        name:
          type: string
          example: Eduardo Lourenço
        email:
          type: string
          format: email
          example: eduardo@puc-crypto.com.br
        avatarUrl:
          type: string
          format: uri
          example: https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80
        role:
          type: string
          example: Analista de Mercado
        organization:
          type: string
          example: PUC Minas / Crypto Lab
        watchlist:
          type: array
          items:
            $ref: '#/components/schemas/UserWatchlistItem'
        preferences:
          $ref: '#/components/schemas/UserPreferences'
        createdAt:
          type: string
          format: date-time
          example: '2025-01-15T10:00:00Z'
        lastLogin:
          type: string
          example: Hoje às 20:00

    MeResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/UserProfile'
        unreadNotifications:
          type: integer
          example: 2
        serverRegion:
          type: string
          example: brazilsouth (Azure)

    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Mensagem legível descrevendo a falha.
          example: Dados inválidos
        details:
          description: |
            Nos erros de validação (400), a lista de problemas encontrados. Nos erros
            de infraestrutura (500), a mensagem original do driver do MongoDB.
          oneOf:
            - type: array
              items:
                type: string
            - type: string
          example:
            - symbol é obrigatório e deve ter de 2 a 10 caracteres alfanuméricos
