# Um único servidor entrega o shell (/) e os três microfrontends (/mfe-*/).
# Cada microfrontend continua sendo um build independente, com o seu remoteEntry.js.
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Os pontos de entrada não ficam em cache: uma nova versão é vista na próxima visita.
    location ~* (index\.html|remoteEntry\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Os demais arquivos têm o conteúdo no nome e podem ficar em cache.
    location ~* ^/(assets|mfe-[a-z]+/assets)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* ^/mfe-[a-z]+/ {
        try_files $uri =404;
    }

    # Rotas do shell (ex.: /criptomoedas) são resolvidas no navegador.
    location / {
        try_files $uri /index.html;
    }
}
