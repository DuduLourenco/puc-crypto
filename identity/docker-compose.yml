name: puccrypto-identity

# Sobe o Identity e o seu banco. Valores apenas para desenvolvimento local.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: identity_user
      POSTGRES_PASSWORD: identity_dev
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity_user -d identity_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  identity-api:
    build: .
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=identity_db;Username=identity_user;Password=identity_dev
      Jwt__SigningKey: puccrypto-dev-only-signing-key-0123456789abcdef
    ports:
      - "127.0.0.1:5101:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
