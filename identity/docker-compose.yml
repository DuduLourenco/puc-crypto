name: puccrypto-identity

# Sobe o Identity e o seu banco (SQL Server, equivalente local do Azure SQL).
# Valores apenas para desenvolvimento local.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: PucCrypto_dev_123
    ports:
      - "127.0.0.1:1440:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P PucCrypto_dev_123 -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  identity-api:
    build: .
    environment:
      ConnectionStrings__Database: Server=sqlserver,1433;Database=identity_db;User Id=sa;Password=PucCrypto_dev_123;TrustServerCertificate=True
      Jwt__SigningKey: puccrypto-dev-only-signing-key-0123456789abcdef
    ports:
      - "127.0.0.1:5101:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqlserver-data:
