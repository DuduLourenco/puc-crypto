name: puccrypto-forecast

# Sobe o Function App e o Azurite (storage exigido pelo runtime). Valores apenas para desenvolvimento local.
# GetForecast funciona sozinho. A coleta agendada chama o MarketData em MarketData__BaseUrl;
# por padrão, um MarketData rodando na máquina (porta 5103).

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck --loose
    ports:
      - "127.0.0.1:10000-10002:10000-10002"

  forecast-function:
    build: .
    platform: linux/amd64
    environment:
      FUNCTIONS_WORKER_RUNTIME: dotnet-isolated
      AzureWebJobsStorage: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      AzureWebJobsSecretStorageType: files
      CollectPricesSchedule: "0 */30 * * * *"
      MarketData__BaseUrl: http://host.docker.internal:5103/
      MarketData__CollectorApiKey: puccrypto-dev-collector-key
    volumes:
      # Chaves fixas de desenvolvimento (x-functions-key: puccrypto-dev-function-key).
      - ./local/host-secrets.json:/azure-functions-host/Secrets/host.json:ro
    ports:
      - "127.0.0.1:7071:80"
    depends_on:
      - azurite
