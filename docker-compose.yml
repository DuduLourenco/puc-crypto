name: puccrypto

# Sistema completo no ambiente local. Requer um arquivo .env (ver .env.example).
# Cada pasta (identity/, catalog/, ...) é um repositório independente, com o
# seu próprio Dockerfile; este arquivo apenas os reúne para desenvolvimento.

services:
  # ---------- Infraestrutura ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: identity_user
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD}
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity_user -d identity_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Equivalente local do Azure SQL Database. A imagem é x64 e roda por emulação em Macs ARM.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "127.0.0.1:1440:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # Equivalente local do MongoDB Atlas.
  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27040:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Equivalente local do Azure Storage, exigido pelo runtime das Functions (gatilho agendado).
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck --loose
    ports:
      - "127.0.0.1:10000-10002:10000-10002"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- Serviços ----------
  identity-api:
    build: ./identity
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=identity_db;Username=identity_user;Password=${IDENTITY_DB_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    ports:
      - "127.0.0.1:5101:8080"
    depends_on:
      postgres:
        condition: service_healthy

  catalog-api:
    build: ./catalog
    environment:
      ConnectionStrings__Database: Server=sqlserver,1433;Database=catalog_db;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      RabbitMq__Uri: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    ports:
      - "127.0.0.1:5102:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  marketdata-api:
    build: ./marketdata
    environment:
      ConnectionStrings__Database: mongodb://mongo:27017
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      RabbitMq__Uri: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      Collector__ApiKey: ${COLLECTOR_API_KEY}
      CoinGecko__ApiKey: ${COINGECKO_API_KEY:-}
    ports:
      - "127.0.0.1:5103:8080"
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Azure Functions (GetForecast e coleta agendada). A imagem do runtime é x64.
  forecast-function:
    build: ./forecast-function
    platform: linux/amd64
    environment:
      FUNCTIONS_WORKER_RUNTIME: dotnet-isolated
      AzureWebJobsStorage: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      AzureWebJobsSecretStorageType: files
      CollectPricesSchedule: ${COLLECT_PRICES_SCHEDULE:-0 */30 * * * *}
      MarketData__BaseUrl: http://marketdata-api:8080/
      MarketData__CollectorApiKey: ${COLLECTOR_API_KEY}
    volumes:
      # Chaves fixas de desenvolvimento (x-functions-key: puccrypto-dev-function-key).
      - ./forecast-function/local/host-secrets.json:/azure-functions-host/Secrets/host.json:ro
    ports:
      - "127.0.0.1:7071:80"
    depends_on:
      - azurite
      - marketdata-api

volumes:
  postgres-data:
  sqlserver-data:
  mongo-data:
