name: puccrypto

# Sistema completo no ambiente local. Requer um arquivo .env (ver .env.example).
# Cada pasta (identity/, catalog/, ...) é um repositório independente, com o
# seu próprio Dockerfile; este arquivo apenas os reúne para desenvolvimento.

services:
  # ---------- Infraestrutura ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/local/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- Serviços ----------
  identity-api:
    build: ./identity
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=identity_db;Username=identity_user;Password=${IDENTITY_DB_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    ports:
      - "127.0.0.1:5101:8080"
    depends_on:
      postgres:
        condition: service_healthy

  catalog-api:
    build: ./catalog
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=catalog_db;Username=catalog_user;Password=${CATALOG_DB_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5102:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
